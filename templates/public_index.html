<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Dashboard (Public)</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <div>
        <p class="eyebrow">Shared Dashboard</p>
        <h1>Attendance Insights (Public)</h1>
        <p class="hero-copy">Read-only view generated by share link.</p>
      </div>
      <div class="hero-actions">
        <a href="/" class="button button-secondary">Home</a>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Students</div>
        <div class="stat-value" id="statStudents">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Days</div>
        <div class="stat-value" id="statDays">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Average Attendance</div>
        <div class="stat-value" id="statAverage">—%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Absences</div>
        <div class="stat-value" id="statAbsences">—</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <h3>Date range filter</h3>
      <div class="filter-row">
        <label>Start: <input type="date" id="startDate" /></label>
        <label>End: <input type="date" id="endDate" /></label>
        <button id="applyRange" class="button">Apply Filter</button>
        <button id="clearRange" class="button button-secondary">Clear</button>
      </div>
      <p id="rangeMsg" class="message info"></p>
    </div>
    <div class="chart-row">
      <div class="card">
        <h3>Daily Attendance Rate (%)</h3>
        <canvas id="dailyChart"></canvas>
      </div>
      <div class="card">
        <h3>Top Absences</h3>
        <canvas id="absentChart"></canvas>
      </div>
    </div>
    <p class="note">This is a read-only shared view.</p>
  </div>

<script>
const TOKEN = '{{ token }}';
async function fetchJSON(url){
  const res = await fetch(url);
  return res.json();
}

function currentFilters(){
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  const params = new URLSearchParams();
  if (start) params.append('start_date', start);
  if (end) params.append('end_date', end);
  return params.toString() ? `?${params.toString()}` : '';
}

async function fetchDaily(){
  const daily = await fetchJSON(`/share_api/daily_rates/${TOKEN}${currentFilters()}`);
  renderDaily(daily);
  return daily;
}

async function fetchAbsences(){
  const abs = await fetchJSON(`/share_api/absences/${TOKEN}${currentFilters()}`);
  renderAbsences(abs.slice(0,10));
  return abs;
}

async function fetchSummary(){
  const summary = await fetchJSON(`/share_api/summary/${TOKEN}${currentFilters()}`);
  document.getElementById('statStudents').textContent = summary.total_students;
  document.getElementById('statDays').textContent = summary.total_days;
  document.getElementById('statAverage').textContent = `${summary.average_attendance}%`;
  document.getElementById('statAbsences').textContent = summary.total_absences;
  return summary;
}

let dailyChartInstance = null;
let absentChartInstance = null;

function renderDaily(daily){
  const labels = daily.map(r => r.date);
  const data = daily.map(r => r.present_rate);
  const ctx = document.getElementById('dailyChart');
  if (dailyChartInstance) dailyChartInstance.destroy();
  dailyChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ label: 'Attendance %', data, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.15)', tension: 0.2 }] },
    options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
  });
}

function renderAbsences(list){
  const labels = list.map(r => r.student_name);
  const data = list.map(r => r.absences);
  const ctx = document.getElementById('absentChart');
  if (absentChartInstance) absentChartInstance.destroy();
  absentChartInstance = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Absences', data, backgroundColor: '#ef4444' }] },
    options: { responsive: true }
  });
}

(async ()=>{
  await fetchDaily();
  await fetchAbsences();
  await fetchSummary();
  document.getElementById('applyRange').addEventListener('click', async () => {
    await fetchDaily();
    await fetchAbsences();
    await fetchSummary();
    document.getElementById('rangeMsg').textContent = 'Filter applied';
  });
  document.getElementById('clearRange').addEventListener('click', async () => {
    document.getElementById('startDate').value = '';
    document.getElementById('endDate').value = '';
    await fetchDaily();
    await fetchAbsences();
    await fetchSummary();
  });
})();
</script>
</body>
</html>
